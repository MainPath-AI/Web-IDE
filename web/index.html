<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web-IDE</title>
    <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="boot">
      <p class="mark">Web-IDE</p>
      <p id="status">Loading Linux into this tab.</p>
      <div class="track" aria-hidden="true"><div id="bar"></div></div>
    </div>
    <div id="workspace" hidden>
      <header>
        <strong>Web-IDE</strong>
        <span id="guest-status">Guest is starting</span>
      </header>
      <div id="stage">
        <div id="ide-wait">
          <p class="mark">VS Code</p>
          <p id="ide-detail">Starting in the guest. The editor replaces this panel when it answers.</p>
        </div>
        <iframe id="ide" title="VS Code" hidden></iframe>
        <div id="terminal"></div>
      </div>
    </div>
    <script>
      var Module = {};
      if (!window.crossOriginIsolated) {
        document.getElementById("status").textContent =
          "Open this page over HTTPS. On plain HTTP the browser disables SharedArrayBuffer, so the Linux guest cannot start.";
        document.getElementById("bar").style.width = "0";
      } else {
        var loader = document.createElement("script");
        loader.src = "/load.js";
        document.body.appendChild(loader);
        var boot = document.createElement("script");
        boot.type = "module";
        boot.src = "/boot.js?v=10";
        document.body.appendChild(boot);
      }
    </script>
  </body>
</html>
