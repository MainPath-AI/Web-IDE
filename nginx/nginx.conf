map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Keep editor IPC out of the emulated guest's serialized zlib queues. Other
# routes retain the original negotiation, including the emulator transport.
map $uri $web_ide_socket_extensions {
    "~^/sessions/[a-f0-9]{32}/editor(?:/|$)" "";
    default $http_sec_websocket_extensions;
}
include /usr/share/nginx/html/asset-versions.conf;

map $uri $web_ide_log_uri {
    "~^/sessions/[a-f0-9]{32}/(?<session_path>.*)$" "/sessions/[redacted]/$session_path";
    default $uri;
}
log_format web_ide '$remote_addr [$time_local] "$request_method $web_ide_log_uri $server_protocol" '
                   '$status $body_bytes_sent $request_time upstream_status=$upstream_status '
                   'connect=$upstream_connect_time header=$upstream_header_time response=$upstream_response_time';

server {
    listen 80;
    # A server-level directive replaces inherited combined logs; adding a
    # second http-level log would still disclose session tokens in the first.
    access_log /dev/stdout web_ide;
    # HTTP error messages append the original request URI and cannot use our
    # redacted log_format. Keep request diagnostics in the access log above;
    # global Nginx configuration/startup/process errors keep their own log.
    error_log /dev/null;
    server_name _;
    root /usr/share/nginx/html;
    gzip off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header Cross-Origin-Opener-Policy same-origin always;
    # credentialless keeps SharedArrayBuffer and lets the editor iframe load.
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy no-referrer always;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    location ~ ^/(load\.js|arg-module\.js|out\.js|qemu-system-x86_64\.(data|wasm))$ {
        if ($web_ide_valid_asset = 0) { return 409; }
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /sessions/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 18080;
    access_log /dev/stdout web_ide;
    error_log /dev/null;
    server_name _;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Referrer-Policy no-referrer always;

    # The virtual machine serves the editor session. The large static files
    # are on this nginx so the emulated CPU can spend its time on the session.
    # Every document, including the extension-host iframe, needs COEP or the
    # parent page will refuse to embed it.
    location ~ "^/sessions/[a-f0-9]{32}/editor/stable-[0-9a-f]+/static/(.*)$" {
        root /usr/share/nginx/editor/vscode;
        try_files /$1 =404;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "no-store" always;
        etag off;
    }

    location ~ "^/sessions/[a-f0-9]{32}/editor/_static/(.*)$" {
        alias /usr/share/nginx/editor/coder/$1;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "no-store" always;
        etag off;
    }

    location /sessions/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Sec-WebSocket-Extensions $web_ide_socket_extensions;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        sub_filter_once on;
        sub_filter '&quot;serviceWorker&quot;:{&quot;scope&quot;:&quot;./&quot;,&quot;path&quot;:&quot;./_static/out/browser/serviceWorker.js&quot;},' '';
    }
    location / { return 404; }
}
